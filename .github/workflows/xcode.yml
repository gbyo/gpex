name: Xcode

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Build and test GPeX
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild \
            -project GPeX.xcodeproj \
            -scheme GPeX \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            test
